[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cer"
version = "1.0.0"
description = "Canonical Evidence Registry (CER) — versioned contract layer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
